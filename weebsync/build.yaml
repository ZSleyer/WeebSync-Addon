build_from:
  aarch64: ghcr.io/hassio-addons/base:stable
  amd64: ghcr.io/hassio-addons/base:stable
args:
  # repo:tag@digest. The tag names the channel we follow, the digest is what
  # actually gets built. Without it Docker resolves the tag against whatever
  # copy the host already has and never pulls, so a version bump could ship a
  # days-old binary while claiming to be new - which is exactly what happened
  # on 2026-07-25. track-upstream rewrites the digest and resolves against the
  # tag part.
  WEEBSYNC_IMAGE: ghcr.io/zsleyer/weebsync:dev@sha256:6fbf4b278c694e0d5ab9b09082ef036ef9bb2cdc36668630fe123d34c14569f2
labels:
  org.opencontainers.image.source: https://github.com/ZSleyer/WeebSync
