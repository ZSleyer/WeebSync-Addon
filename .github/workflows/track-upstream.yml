name: track-upstream

# Releases a new add-on version whenever the tracked upstream image digest
# changes, or when the add-on itself changes on main.
#
# A release builds the add-on image for every arch and pushes it to
# ghcr.io/zsleyer/{arch}-weebsync-addon:<version>; only after both pushes
# succeeded does it commit the new version (and digest pin) to main. The
# Supervisor pulls that image instead of building it on the host, so a version
# must never land on main before its image exists, and old tags must never be
# deleted: restoring a backup pulls exactly the version it was taken with.
#
# WEEBSYNC_IMAGE in weebsync/build.yaml holds repo:tag@digest - the tag
# (currently :dev) is what this resolves against, the digest is what gets built.
on:
  # WeebSync fires this right after pushing an image, from both the per-push
  # dev build and the nightly one; the cron is only the safety net for a
  # dispatch that got lost or an out-of-band push.
  repository_dispatch:
    types: [upstream-image]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # Changes to the wrapper itself (Dockerfile, rootfs, AppArmor, pin) need a
  # new image too. The release commit is pushed with GITHUB_TOKEN and so does
  # not trigger this again.
  push:
    branches: [main]
    paths:
      - "weebsync/**"
      - ".github/workflows/track-upstream.yml"
      - "!weebsync/config.yaml"
      - "!weebsync/**.md"

permissions:
  contents: write
  packages: write

concurrency: track-upstream

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      digest: ${{ steps.up.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
      rev: ${{ steps.version.outputs.rev }}
      old_rev: ${{ steps.version.outputs.old_rev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve upstream digest
        id: up
        run: |
          set -euo pipefail
          IMAGE=$(sed -n 's/.*WEEBSYNC_IMAGE: *//p' weebsync/build.yaml | head -1)
          REF=${IMAGE%@*} # drop the pinned digest, keep repo:tag
          REPO=${REF%:*}; TAG=${REF##*:}
          PATH_=${REPO#ghcr.io/}
          echo "image=$IMAGE ref=$REF"
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${PATH_}:pull" | jq -r .token)
          DIGEST=$(curl -sI \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${PATH_}/manifests/${TAG}" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          [ -n "$DIGEST" ] || { echo "no digest resolved"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          # pass step output via env, never interpolate ${{ }} into the shell body
          # (github/code-injection): quoting here makes the value inert
          NEW: ${{ steps.up.outputs.digest }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # build.yaml is the single source of what we ship: the pin IS the
          # record of the last tracked digest, so there is no second file to
          # drift out of step with it.
          CUR=$(sed -n 's/.*WEEBSYNC_IMAGE: *//p' weebsync/build.yaml | head -1 | sed -n 's/.*@//p')
          if [ "$NEW" = "$CUR" ] && [ "$EVENT" != push ] && [ "$EVENT" != workflow_dispatch ]; then
            echo "digest unchanged, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        if: steps.decide.outputs.release == 'true'
        env:
          NEW: ${{ steps.up.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The version follows the WeebSync program version: the latest release
          # tag, plus the number of upstream commits since it for a :dev build
          # (2026.11.0.42). A rebuild of the same upstream build (wrapper change)
          # appends a counter (2026.11.0.42.1).
          IMAGE=$(sed -n 's/.*WEEBSYNC_IMAGE: *//p' weebsync/build.yaml | head -1)
          REPO=${IMAGE%%:*}
          rev_of() {
            docker buildx imagetools inspect "$REPO@$1" --format '{{json .Image}}' \
              | jq -r '(.["linux/amd64"] // .).config.Labels["org.opencontainers.image.revision"] // empty'
          }
          REV=$(rev_of "$NEW")
          OLD=$(rev_of "${IMAGE#*@}" || true)
          TAG=$(gh api repos/ZSleyer/WeebSync/releases/latest -q .tag_name)
          AHEAD=$(gh api "repos/ZSleyer/WeebSync/compare/$TAG...$REV" -q .ahead_by)
          BASE=${TAG#v}
          [ "$AHEAD" -gt 0 ] && BASE="$BASE.$AHEAD"
          CUR=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' weebsync/config.yaml)
          if [ "$CUR" = "$BASE" ]; then
            VER="$BASE.1"
          elif [[ $CUR == "$BASE".* && ${CUR#"$BASE".} =~ ^[0-9]+$ ]]; then
            VER="$BASE.$(( ${CUR#"$BASE".} + 1 ))"
          else
            VER=$BASE
          fi
          echo "version=$VER rev=$REV old=$OLD"
          { echo "version=$VER"; echo "rev=$REV"; echo "old_rev=$OLD"; } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build args
        id: args
        env:
          NEW: ${{ needs.plan.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          IMAGE=$(sed -n 's/.*WEEBSYNC_IMAGE: *//p' weebsync/build.yaml | head -1)
          echo "weebsync_image=${IMAGE%@*}@$NEW" >> "$GITHUB_OUTPUT"
          echo "build_from=$(yq ".build_from.$ARCH" weebsync/build.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: weebsync
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ghcr.io/zsleyer/${{ matrix.arch }}-weebsync-addon:${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/ZSleyer/WeebSync-Addon
            io.hass.version=${{ needs.plan.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ steps.args.outputs.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.plan.outputs.version }}
            WEEBSYNC_IMAGE=${{ steps.args.outputs.weebsync_image }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the branch the run started on: main for every automatic trigger, a
          # feature branch when testing a change via workflow_dispatch
          ref: ${{ github.ref_name }}

      - name: Commit version, pin and changelog
        env:
          NEW: ${{ needs.plan.outputs.digest }}
          VER: ${{ needs.plan.outputs.version }}
          REV: ${{ needs.plan.outputs.rev }}
          OLD_REV: ${{ needs.plan.outputs.old_rev }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Changelog entry: upstream commits since the previously shipped build,
          # then changes to the wrapper since the previous release.
          upstream=""
          if [ -n "$OLD_REV" ] && [ "$OLD_REV" != "$REV" ]; then
            upstream=$(gh api "repos/ZSleyer/WeebSync/compare/$OLD_REV...$REV" \
              -q '.commits[] | "- " + (.commit.message | split("\n")[0])' | tail -n 30)
          fi
          last=$(git log -1 --format=%H --grep='^chore: \(release\|track upstream\)' || true)
          wrapper=$(git log --no-merges --format='- %s' ${last:+$last..}HEAD -- weebsync \
            | grep -vE '^- chore: (release|track upstream)' || true)
          {
            echo "# Changelog"; echo
            echo "## $VER"; echo
            echo "WeebSync [\`${REV:0:7}\`](https://github.com/ZSleyer/WeebSync/commit/$REV)"; echo
            [ -n "$upstream" ] && { echo "$upstream"; echo; }
            [ -n "$wrapper" ] && { echo "Add-on:"; echo; echo "$wrapper"; echo; }
            [ -f weebsync/CHANGELOG.md ] && sed '1{/^# Changelog/d}' weebsync/CHANGELOG.md | sed '/./,$!d'
          } > weebsync/CHANGELOG.md.new
          mv weebsync/CHANGELOG.md.new weebsync/CHANGELOG.md
          git add weebsync/CHANGELOG.md
          sed -i -E "s/^version: .*/version: \"$VER\"/" weebsync/config.yaml
          # repin: replace everything after the tag, keeping repo:tag intact
          sed -i -E "s|(WEEBSYNC_IMAGE: [^@]+)(@.*)?$|\1@$NEW|" weebsync/build.yaml
          git config user.name "weebsync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $VER ($NEW)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push retry $i"; sleep 5
          done
          exit 1

  cleanup:
    # Keeps the two newest image versions per arch. A backup taken with an older
    # version can then no longer pull its image on restore: install the current
    # version first and restore the data on top.
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ matrix.arch }}-weebsync-addon
          package-type: container
          min-versions-to-keep: 2
