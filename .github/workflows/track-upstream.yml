name: track-upstream

# Bumps the add-on version whenever the tracked upstream image digest changes,
# so Home Assistant surfaces it as an available update, and pins that digest in
# weebsync/build.yaml so the build cannot serve a stale local copy of the tag.
# WEEBSYNC_IMAGE holds repo:tag@digest - the tag (currently :nightly) is what
# this resolves against, the digest is what gets built.
on:
  # WeebSync's nightly build fires this right after pushing the image; the cron
  # is only the safety net for a dispatch that got lost or an out-of-band push.
  repository_dispatch:
    types: [upstream-image]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [weebsync/build.yaml]

permissions:
  contents: write

concurrency: track-upstream

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve upstream digest
        id: up
        run: |
          set -euo pipefail
          IMAGE=$(sed -n 's/.*WEEBSYNC_IMAGE: *//p' weebsync/build.yaml | head -1)
          REF=${IMAGE%@*} # drop the pinned digest, keep repo:tag
          REPO=${REF%:*}; TAG=${REF##*:}
          PATH_=${REPO#ghcr.io/}
          echo "image=$IMAGE ref=$REF"
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${PATH_}:pull" | jq -r .token)
          DIGEST=$(curl -sI \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${PATH_}/manifests/${TAG}" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          [ -n "$DIGEST" ] || { echo "no digest resolved"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Bump version if changed
        env:
          # pass step output via env, never interpolate ${{ }} into the shell body
          # (github/code-injection): quoting here makes the value inert
          NEW: ${{ steps.up.outputs.digest }}
        run: |
          set -euo pipefail
          # build.yaml is the single source of what we ship: the pin IS the
          # record of the last tracked digest, so there is no second file to
          # drift out of step with it.
          CUR=$(sed -n 's/.*WEEBSYNC_IMAGE: *//p' weebsync/build.yaml | head -1 | sed -n 's/.*@//p')
          if [ "$NEW" = "$CUR" ]; then
            echo "digest unchanged, nothing to do"
            exit 0
          fi
          VER=$(date -u +%Y.%-m.%d%H%M%S)
          sed -i -E "s/^version: .*/version: \"$VER\"/" weebsync/config.yaml
          # repin: replace everything after the tag, keeping repo:tag intact
          sed -i -E "s|(WEEBSYNC_IMAGE: [^@]+)(@.*)?$|\1@$NEW|" weebsync/build.yaml
          git config user.name "weebsync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: track upstream $VER ($NEW)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push retry $i"; sleep 5
          done
          exit 1
